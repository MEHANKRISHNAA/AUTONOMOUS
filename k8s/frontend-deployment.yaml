apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: codex-portfolio
  labels:
    app: codex-portfolio-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-portfolio-frontend
  template:
    metadata:
      labels:
        app: codex-portfolio-frontend
    spec:
      containers:
        - name: frontend
          # Built locally with `docker build -t codex-portfolio-frontend:local ./frontend`.
          image: codex-portfolio-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "96Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: codex-portfolio
spec:
  type: NodePort
  selector:
    app: codex-portfolio-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090   # http://localhost:30090 on Docker Desktop Kubernetes
