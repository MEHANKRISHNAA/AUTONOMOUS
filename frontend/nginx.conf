server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js is rewritten at container start - never cache it, or a browser
    # keeps pointing at a previous deployment's backend.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Everything under /api forwarded to the backend - single origin, no CORS
    # needed in the containerised path.
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
}
